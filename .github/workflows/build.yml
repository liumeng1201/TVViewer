name: Build APK

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-standard:
    name: Build Standard APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Standard APK and run Lint
        run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon --stacktrace

      - name: Verify Standard APK
        run: python3 .github/scripts/check-apk.py standard app/build/outputs/apk/debug

      - name: Upload Lint results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-lint-results
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7

      - name: Get short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Upload Standard APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: TVViewer-standard-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1

  build-x5:
    name: Build X5 APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unpack X5 Kernel
        run: |
          unzip -o X5.zip assets/045738_x5.tbs.apk -d app/src/main

      - name: Build X5 APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify X5 APK
        run: python3 .github/scripts/check-apk.py x5 app/build/outputs/apk/debug

      - name: Get short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Upload X5 APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: TVViewer-X5-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1

  emulator-tests:
    name: Android Emulator Tests (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            target: google_apis
            arch: x86_64
            test_args: ''
          - api: 21
            target: default
            arch: x86
            test_args: -Pandroid.testInstrumentationRunnerArguments.class=com.eanyatonic.cctvViewer.LegacyDownloadStorageTest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace ${{ matrix.test_args }}

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-emulator-test-results-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 7
